<!DOCTYPE html>
{% load static %}

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar consumidor</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <main class="single-panel">
        <section class="calculator-panel">
            <h1>Cadastrar consumidor</h1>
            <h2>Preencha os dados para incluir um consumidor na listagem.</h2>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <p id="cep_loading" class="loading-message" hidden>Buscando cidade e estado...</p>
                <p id="cep_error" class="cep-error-message" hidden>Erro ao buscar CEP. Verifique o CEP informado.</p>

                <button type="submit">Salvar consumidor</button>
                <a href="{% url 'calculator' %}" class="secondary-button">Voltar</a>
            </form>
        </section>
    </main>

    <script>
        function allowDecimalInput(event) {
            if (event.inputType !== "insertText") {
                return;
            }

            const nextValue =
                event.target.value.slice(0, event.target.selectionStart) +
                event.data +
                event.target.value.slice(event.target.selectionEnd);

            if (!/^[0-9.,]$/.test(event.data) || (nextValue.match(/[.,]/g) || []).length > 1) {
                event.preventDefault();
            }
        }

        function allowDigitsOnly(event) {
            if (event.inputType === "insertText" && !/^[0-9]$/.test(event.data)) {
                event.preventDefault();
            }
        }

        async function fillAddressByCep(value) {
            const cep = value.replace(/\D/g, "");
            const loading = document.getElementById("cep_loading");
            const error = document.getElementById("cep_error");
            const cityInput = document.getElementById("id_city");
            const stateInput = document.getElementById("id_state");

            if (cep.length !== 8) {
                loading.hidden = true;
                error.hidden = true;
                return;
            }

            loading.hidden = false;
            error.hidden = true;
            cityInput.value = "";
            stateInput.value = "";

            try {
                const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                const data = await response.json();

                if (!response.ok || data.erro) {
                    error.hidden = false;
                    return;
                }

                cityInput.value = data.localidade;
                stateInput.value = data.uf;
            } catch {
                error.hidden = false;
            } finally {
                loading.hidden = true;
            }
        }

        document.getElementById("id_document").onbeforeinput = allowDigitsOnly;
        document.getElementById("id_zip_code").onbeforeinput = allowDigitsOnly;
        document.getElementById("id_zip_code").onblur = function () {
            fillAddressByCep(this.value);
        };
        document.getElementById("id_distributor_tax").onbeforeinput = allowDecimalInput;
    </script>
</body>
</html>
